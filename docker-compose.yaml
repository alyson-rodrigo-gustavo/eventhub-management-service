version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ${POSTGRES_CONTAINER_NAME:-postgres15}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-event-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-redis}
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly yes
      --aclfile /usr/local/etc/redis/users.acl
    volumes:
      - redis-event-data:/data
      - ./redis/users.acl:/usr/local/etc/redis/users.acl
    healthcheck:
      test: ["CMD", "redis-cli", "-u", "${REDIS_URL}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak-db:
    image: mysql:8.0
    container_name: ${KEYCLOAK_DB_CONTAINER_NAME:-keycloak-mysql}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${KEYCLOAK_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${KEYCLOAK_DB_NAME}
    volumes:
      - keycloak-event-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${KEYCLOAK_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: keycloak/keycloak:latest
    container_name: ${KEYCLOAK_CONTAINER_NAME:-keycloak}
    restart: unless-stopped
    environment:
      KC_DB: mysql
      KC_DB_URL: ${KEYCLOAK_DB_URL}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command: ["start-dev"]
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    volumes:
      - keycloak-event-data:/opt/keycloak/data

  eventhub-rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: application-template-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-event-data:/var/lib/rabbitmq

volumes:
  db-event-data: {}
  redis-event-data: {}
  keycloak-event-db-data: {}
  keycloak-event-data: {}
  rabbitmq-event-data: {}