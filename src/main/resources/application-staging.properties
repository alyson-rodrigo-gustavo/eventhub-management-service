spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

spring.flyway.locations=classpath:db/migration

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS}

spring.jpa.show-sql=${JPA_SHOW_SQL}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG}
logging.level.org.hibernate.type.descriptor.sql=${HIBERNATE_BIND_LOG}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

spring.rabbitmq.listener.simple.prefetch=${RABBITMQ_PREFETCH:1}
spring.rabbitmq.listener.simple.concurrency=${RABBITMQ_CONCURRENCY:1}
spring.rabbitmq.listener.simple.max-concurrency=${RABBITMQ_MAX_CONCURRENCY:1}

keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}
keycloak.realm=${KEYCLOAK_REALM:app-eventhub-management-realm}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:eventhub-admin-cli}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
